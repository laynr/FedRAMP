# Non-blocking link audit: failures show up in the Actions tab (and as the
# weekly run's red X) but gate nothing — external link rot should never block
# a deploy or a merge.
name: Link check (non-blocking)

on:
  schedule:
    - cron: '43 10 * * 1' # Mondays 10:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check every cited URL
        run: node tools/check-links.mjs
