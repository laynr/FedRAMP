name: Refresh FedRAMP data snapshots

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run transform tests
        run: node --test tools/*.test.mjs
      - name: Regenerate snapshots
        run: node tools/fedramp-data.mjs snapshot
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh FedRAMP snapshots ($(date -u +%F))"
            git push
          fi
